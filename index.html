<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFK Arena 功能清单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ecef; --panel:#ffffff; --ink:#1f2530; --muted:#5d6675; --line:#d3d8df;
  --head:#232b3a; --head-ink:#f3efe4; --gold:#a8791f; --gold-soft:#f6ecd6; --mark:#ffe28a;
  --r-top:#3b6ea5; --r-left:#a0452e; --r-right:#3e7d58; --r-bup:#7a4f9a; --r-bot:#8a6a1c; --r-center:#2d7f86;
  --unconf-bg:#fbe9e5; --unconf-ink:#9a3a24;
  --p-mid:#7b3fa8; --p-mid-bg:#f1e8f8;
  --p-high:#c2412d; --p-high-bg:#fbe6e2; --p-low:#3b6ea5; --p-low-bg:#e5eef8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151920; --panel:#1e232c; --ink:#e7e9ee; --muted:#9aa3b2; --line:#323946;
    --head:#0f131a; --head-ink:#efe6cf; --gold:#d9ad55; --gold-soft:#3a3120; --mark:#6b5a1d;
    --r-top:#7aa6d8; --r-left:#e08a70; --r-right:#7cc49a; --r-bup:#b891d6; --r-bot:#d4b25a; --r-center:#6cc3ca;
    --unconf-bg:#3b2320; --unconf-ink:#f0a58f;
    --p-mid:#c79ae6; --p-mid-bg:#33243f;
    --p-high:#f08a74; --p-high-bg:#40221d; --p-low:#7aa6d8; --p-low-bg:#1f2c3d;
  }
}
:root[data-theme="dark"]{
  --bg:#151920; --panel:#1e232c; --ink:#e7e9ee; --muted:#9aa3b2; --line:#323946;
  --head:#0f131a; --head-ink:#efe6cf; --gold:#d9ad55; --gold-soft:#3a3120; --mark:#6b5a1d;
  --r-top:#7aa6d8; --r-left:#e08a70; --r-right:#7cc49a; --r-bup:#b891d6; --r-bot:#d4b25a; --r-center:#6cc3ca;
  --unconf-bg:#3b2320; --unconf-ink:#f0a58f;
  --p-mid:#c79ae6; --p-mid-bg:#33243f;
  --p-high:#f08a74; --p-high-bg:#40221d; --p-low:#7aa6d8; --p-low-bg:#1f2c3d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Noto Sans SC","Noto Sans KR","PingFang SC","Apple SD Gothic Neo","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
h1{font-family:"Noto Serif SC","Noto Serif KR",serif;font-weight:900;font-size:clamp(22px,3.2vw,32px);line-height:1.2;margin:0;letter-spacing:.02em;white-space:nowrap}
.hd-title{flex:1 1 auto;min-width:0;position:relative}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.stats{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.stats b{font-size:22px;color:var(--ink);font-weight:700;margin-right:4px;font-variant-numeric:tabular-nums}
.stats .need b{color:var(--gold)}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.toggles{display:flex;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:5px 11px;cursor:pointer;min-width:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--head);color:var(--head-ink)}
@media (max-width:640px){.hd-right{align-items:flex-start}}

.filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input[type=search],.ms-btn{width:100%;height:36px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:0 10px}
.f input[type=search]:focus,.ms-btn:focus-visible,button:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ms{position:relative}
.ms-btn{text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden}
.ms-btn span{overflow:hidden;text-overflow:ellipsis}
.ms-btn::after{content:"";border:5px solid transparent;border-top-color:var(--muted);margin-top:5px;flex:none}
.ms-btn.on{border-color:var(--gold);background:var(--gold-soft)}
.ms-pop{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:none;z-index:30}
.ms.open .ms-pop{display:block}
.ms-pop label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:14px;color:var(--ink);margin:0}
.ms-pop label:hover{background:var(--bg)}
.ms-pop .clear{display:block;width:100%;margin-top:4px;border:0;border-top:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:13px;padding:8px;cursor:pointer;text-align:left}
.reset{height:36px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:7px;padding:0 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.reset:hover{border-color:var(--gold)}

.tbl-wrap{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:940px}
thead th{background:var(--head);color:var(--head-ink);font-weight:500;font-size:13px;text-align:left;padding:10px 12px;white-space:nowrap}
tbody td{border-top:1px solid var(--line);padding:11px 12px;vertical-align:top;font-size:14px}
tbody tr.checked{background:var(--gold-soft)}
td.region{white-space:nowrap;width:1%}
.rg{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.rg svg{flex:none}
td.cat{color:var(--muted);width:1%;white-space:nowrap;font-size:13px}
td.ver{width:1%;white-space:nowrap}
.vtag{display:inline-block;font-size:12px;line-height:1.7;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin:0 4px 2px 0}
.vtag.v-companions{border-color:var(--gold);color:var(--gold)}
td.name{font-weight:700;width:15%;min-width:130px}
td.desc{color:var(--ink);max-width:68ch;position:relative;padding-right:36px}
td.desc p{margin:0}
td.desc ul{margin:2px 0;padding-left:1.25em}
td.desc li{margin:1px 0}
td.desc li.l2{margin-left:1.2em;list-style:circle}
td.desc .gap{height:.55em}
td.edc{position:relative;padding-right:34px;cursor:text}
td.edc .editor{cursor:auto}
td.region.edc,td.cat.edc{white-space:nowrap}
.ed-btn{position:absolute;top:8px;right:6px;width:26px;height:26px;border:1px solid transparent;border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;opacity:.35}
tr:hover .ed-btn,.ed-btn:focus-visible{opacity:1;border-color:var(--line)}
@media (hover:none){.ed-btn{opacity:.8}}
.edited-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.editor input[type=text]{width:100%;min-width:150px;height:32px;border:1px solid var(--gold);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:0 8px}
.editor.ed-region,.editor.ed-cat{min-width:180px}
.editor textarea{width:100%;min-height:140px;resize:vertical;border:1px solid var(--gold);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;line-height:1.6;padding:8px 10px}
.ed-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.ed-bar .hint{flex:1 1 220px;font-size:12px;color:var(--muted)}
.ed-bar button{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:0 12px;cursor:pointer}
.ed-bar button.primary{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.sync{font-size:12px;color:var(--muted);margin:10px 2px 0;min-height:1.4em}
.sync.warn{color:var(--unconf-ink)}
td.need{text-align:center;width:1%}
td.need input{width:20px;height:20px;accent-color:var(--gold);cursor:pointer}
td.prio{width:1%;white-space:nowrap}
td.prio select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:0 6px;cursor:pointer}
td.prio select.p-high{border-color:var(--p-high);color:var(--p-high);background:var(--p-high-bg);font-weight:700}
td.prio select.p-mid{border-color:var(--p-mid);color:var(--p-mid);background:var(--p-mid-bg);font-weight:700}
td.prio select.p-low{border-color:var(--p-low);color:var(--p-low);background:var(--p-low-bg);font-weight:700}
td.prio select.p-none{border-style:dashed;color:var(--muted);opacity:.7;font-weight:400}
.unconf{display:inline-block;background:var(--unconf-bg);color:var(--unconf-ink);font-size:12px;border-radius:4px;padding:0 6px;margin:0 2px;line-height:1.7}
mark{background:var(--mark);color:inherit;border-radius:2px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}
.note{font-size:12px;color:var(--muted);margin-top:12px}

@media (max-width:900px){
  .filters{grid-template-columns:repeat(2,minmax(0,1fr));position:static}
  .reset{grid-column:1/-1}
}
@media (max-width:640px){
  .wrap{padding:18px 12px 36px}
  .tbl-wrap{overflow:visible;background:none;border:0}
  table{min-width:0}
  thead{display:none}
  table,tbody,tr,td{display:block;width:auto!important}
  tbody tr{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
  tbody td{border:0;padding:2px 0}
  td.region{grid-column:1}
  td.need{grid-column:2;grid-row:1/3;align-self:start}
  td.prio{grid-column:1/-1;margin-top:6px}
  td.cat,td.ver{grid-column:1}
  td.name,td.desc{grid-column:1/-1;max-width:none}
  td.desc{padding-right:34px}
  td.name{margin-top:6px}
}
html[lang="ko"] body{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
html[lang="ko"] h1{font-family:"Noto Serif KR",serif}
.teambar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border:1px dashed var(--gold);border-radius:10px;background:var(--gold-soft);font-size:13px}
.teambar span{flex:1 1 260px}
td.need input:disabled,td.prio select:disabled{cursor:default;opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd-title">
      <h1 data-i18n="title"></h1>
    </div>
    <div class="hd-right">
      <div class="toggles">
        <div class="seg" id="langSeg" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">中</button><button type="button" data-lang="ko">한</button>
        </div>
        <div class="seg" id="themeSeg" role="group" aria-label="Theme">
          <button type="button" data-theme-btn="light" aria-label="Light">☀</button><button type="button" data-theme-btn="dark" aria-label="Dark">☾</button>
        </div>
      </div>
      <div class="stats">
        <div><b id="nShown">0</b><span data-i18n="shown"></span></div>
        <div class="need"><b id="nNeed">0</b><span data-i18n="need"></span></div>
        <div><b id="nEdited">0</b><span data-i18n="edited"></span></div>
        <div><b id="nAll">0</b><span data-i18n="all"></span></div>
      </div>
    </div>
  </header>

  <section class="filters" aria-label="筛选">
    <div class="f"><label id="lb-region" data-i18n="h_region"></label><div class="ms" data-key="region" aria-labelledby="lb-region"></div></div>
    <div class="f"><label id="lb-cat" data-i18n="h_cat"></label><div class="ms" data-key="cat" aria-labelledby="lb-cat"></div></div>
    <div class="f"><label id="lb-ver" data-i18n="h_ver"></label><div class="ms" data-key="ver" aria-labelledby="lb-ver"></div></div>
    <div class="f"><label for="q-name" data-i18n="h_name"></label><input type="search" id="q-name" data-i18n-ph="ph_name"></div>
    <div class="f"><label for="q-desc" data-i18n="h_desc"></label><input type="search" id="q-desc" data-i18n-ph="ph_desc"></div>
    <div class="f"><label id="lb-need" data-i18n="h_need"></label><div class="ms" data-key="need" aria-labelledby="lb-need"></div></div>
    <div class="f"><label id="lb-prio" data-i18n="h_prio"></label><div class="ms" data-key="prio" aria-labelledby="lb-prio"></div></div>
    <button class="reset" id="reset" type="button" data-i18n="reset"></button>
  </section>
  <div class="teambar" id="teamBar" hidden>
    <span id="teamMsg"></span>
    <button type="button" class="reset" id="dlState"></button>
  </div>
  <p class="sync" id="syncStatus" role="status" hidden></p>

  <div class="tbl-wrap">
    <table>
      <thead><tr><th data-i18n="h_region"></th><th data-i18n="h_cat"></th><th data-i18n="h_ver"></th><th data-i18n="h_name"></th><th data-i18n="h_desc"></th><th data-i18n="h_need"></th><th data-i18n="h_prio"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden><span data-i18n="empty"></span><br><button class="reset" type="button" onclick="resetFilters()" data-i18n="reset"></button></div>
  </div>
  <p class="note" data-i18n="note"></p>
</div>

<script>
/* UI strings. en / ko fall back to zh until translated. */
const STR = {
  zh:{title:"AFK Arena 功能清单",sub:"按截图画面位置归类，“版本”标明功能属于 Classic 还是 Companions。标红的 UNCONF 为未能核实的内容。",
      shown:"显示中",need:"已标记需要",all:"全部",h_region:"区域",h_cat:"分类",h_name:"功能",h_desc:"说明",h_need:"是否需要",
      ph_name:"搜索功能名",ph_desc:"搜索说明文字",reset:"清除筛选",empty:"没有符合条件的功能。",
      note:"勾选与优先级为团队共享数据（来自 state.json）；筛选、主题与语言只保存在本浏览器中。",
      ms_all:"全部",ms_n:"已选 {n} 项",ms_clear:"全部（清除此项）",h_ver:"版本",opt_classic:"Classic",opt_companions:"Companions",opt_yes:"已勾选",opt_no:"未勾选",aria_need:"需要：",h_prio:"优先级",p_high:"高",p_mid:"中",p_low:"低",p_none:"未设置",aria_prio:"优先级：",
      ed_edit:"编辑说明",ed_edit_region:"编辑区域",ed_edit_cat:"编辑分类",ed_edit_name:"编辑功能",ed_edit_desc:"编辑说明",ed_changed:"已修改",edited:"已修改",ed_save:"保存",ed_cancel:"取消",ed_restore:"恢复原文",ed_restore_confirm:"恢复为原始说明？当前修改会被丢弃。",
      ed_hint:"行首输入“- ”为项目符号，前面再空两格为二级；Ctrl/⌘+Enter 保存，Esc 取消。",
      st_shared:"区域、分类、功能、说明的修改暂存在共享数据中，所有能打开此页面的人都会看到。",st_saving:"保存中…",st_saved:"已保存。",
      st_local:"共享存储不可用：修改只保存在本浏览器。",st_readonly:"你对此页面只有查看权限，无法修改说明。",

 .sort((a,b)=>REGION_ORDER.indexOf(a.region)-REGION_ORDER.indexOf(b.region)||a.id-b.id);

const PRIO_OPTS = ["high","mid","low","none"];
const NEED_OPTS = [{v:"yes",k:"opt_yes"},{v:"no",k:"opt_no"}];
const STORE_KEY = "afk_ui_checklist_v1";
let state = {checked:[], region:[], cat:[], ver:[], need:[], prio:[], prioMap:{}, qName:"", qDesc:"", lang:"en", theme:"light"};

/* ---------- persistence: localStorage + cookie (best effort) ---------- */
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){}
  if(!raw){
    try{
      const m = document.cookie.match(new RegExp("(?:^|; )"+STORE_KEY+"=([^;]*)"));
      if(m) raw = decodeURIComponent(m[1]);
    }catch(e){}
  }
  if(raw){ try{ state = Object.assign(state, JSON.parse(raw)); }catch(e){} }
  state.region = (state.region||[]).map(v=>REGIONS[v] ? REGIONS[v].label : v);
}
function save(){
  const raw = JSON.stringify(state);
  try{ localStorage.setItem(STORE_KEY, raw); }catch(e){}
  try{ document.cookie = STORE_KEY+"="+encodeURIComponent(raw)+"; max-age=31536000; path=/; SameSite=Lax"; }catch(e){}
}

/* ---------- helpers ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(text, q){
  let h = esc(text);
  if(q){
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    h = h.replace(re, m => "<mark>"+m+"</mark>");
  }
  return h.replace(/\[(UNCONF[^\]]*)\]/g, (m,inner)=>'<span class="unconf">'+inner+'</span>');
}
/* description: plain text with line breaks; "- " / "* " / "• " at line start = bullet, 2+ leading spaces = level 2 */
function fmt(text, q){
  let html = "", inList = false;
  for(const ln of String(text).split(/\r?\n/)){
    const m = ln.match(/^(\s*)[-*•]\s+(.*)$/);
    if(m){
      if(!inList){ html += "<ul>"; inList = true; }
      html += '<li'+(m[1].replace(/\t/g,"  ").length>=2?' class="l2"':"")+'>'+hl(m[2], q)+'</li>';
    }else{
      if(inList){ html += "</ul>"; inList = false; }
      html += ln.trim()==="" ? '<div class="gap"></div>' : "<p>"+hl(ln, q)+"</p>";
    }
  }
  return inList ? html+"</ul>" : html;
}
function phone(key){
  const z = REGIONS[key].zone, c = "var("+COLOR[key]+")";
  return '<svg width="16" height="24" viewBox="0 0 14 22" aria-hidden="true">'+
    '<rect x=".5" y=".5" width="13" height="21" rx="2" fill="none" stroke="currentColor" stroke-opacity=".45"/>'+
    '<rect x="'+z[0]+'" y="'+z[1]+'" width="'+z[2]+'" height="'+z[3]+'" rx=".6" fill="'+c+'"/></svg>';
}

/* ---------- multi-select dropdowns ---------- */
const OPTIONS = {
  region: REGION_ORDER.map(k=>({v:REGIONS[k].label,t:REGIONS[k].label})),
  cat: Object.keys(REGIONS).map(k=>({v:REGIONS[k].cat,t:REGIONS[k].cat})),
  ver: [{v:"classic",k:"opt_classic"},{v:"companions",k:"opt_companions"}],
  need: NEED_OPTS,
  prio: PRIO_OPTS.map(v=>({v,k:"p_"+v}))
};
const optText = o => o.k ? t(o.k) : o.t;
function buildMS(el){
  const key = el.dataset.key;
  el.innerHTML = '<button type="button" class="ms-btn" aria-haspopup="true" aria-expanded="false"><span></span></button><div class="ms-pop" role="group"></div>';
  const btn = el.querySelector(".ms-btn"), pop = el.querySelector(".ms-pop");
  pop.innerHTML = OPTIONS[key].map(o=>'<label><input type="checkbox" value="'+esc(o.v)+'"><span class="opt"></span></label>').join("")+
    '<button type="button" class="clear"></button>';
  btn.addEventListener("click", e=>{
    e.stopPropagation();
    const open = !el.classList.contains("open");
    document.querySelectorAll(".ms.open").forEach(m=>{m.classList.remove("open");m.querySelector(".ms-btn").setAttribute("aria-expanded","false")});
    if(open){el.classList.add("open");btn.setAttribute("aria-expanded","true")}
  });
  pop.addEventListener("click", e=>e.stopPropagation());
  pop.addEventListener("change", ()=>{
    state[key] = [...pop.querySelectorAll("input:checked")].map(i=>i.value);
    syncMS(); render(); save();
  });
  pop.querySelector(".clear").addEventListener("click", ()=>{ state[key]=[]; syncMS(); render(); save(); });
}
function syncMS(){
  document.querySelectorAll(".ms").forEach(el=>{
    const key = el.dataset.key, sel = state[key];
    el.querySelectorAll(".ms-pop input").forEach(i=>i.checked = sel.includes(i.value));
    el.querySelectorAll(".ms-pop .opt").forEach((sp,i)=>sp.textContent = optText(OPTIONS[key][i]));
    el.querySelector(".clear").textContent = t("ms_clear");
    const btn = el.querySelector(".ms-btn");
    btn.classList.toggle("on", sel.length>0);
    btn.querySelector("span").textContent = sel.length===0 ? t("ms_all") :
      sel.length===1 ? optText(OPTIONS[key].find(o=>o.v===sel[0])) : t("ms_n").replace("{n}",sel.length);
  });
}
document.addEventListener("click", ()=>document.querySelectorAll(".ms.open").forEach(m=>{m.classList.remove("open");m.querySelector(".ms-btn").setAttribute("aria-expanded","false")}));

/* ---------- row overrides (shared db, local fallback) ----------
   db doc descs/<id> = {text?, region?, cat?, name?, updatedAt}; absent field = original value. */
const OV_KEY = STORE_KEY+"_descs";
const FIELDS = ["region","cat","name","desc"];
const DBF = {desc:"text", region:"regionLabel", cat:"cat", name:"name",
             desc_en:"text_en", region_en:"regionLabel_en", cat_en:"cat_en", name_en:"name_en",
             desc_ko:"text_ko", region_ko:"regionLabel_ko", cat_ko:"cat_ko", name_ko:"name_ko"};
const LANG_DATA = {en: DATA_EN, ko: DATA_KO};
const dl = () => (state.lang==="en"||state.lang==="ko") ? state.lang : "zh";   // data language
const sfx = () => dl()==="zh" ? "" : "_"+dl();
const regLabel = (k, lang) => { const l = lang||dl(); return l==="en" ? REGIONS[k].en : l==="ko" ? REGIONS[k].ko : REGIONS[k].label; };
const regCat   = (k, lang) => { const l = lang||dl(); return l==="en" ? REGIONS[k].catEn : l==="ko" ? REGIONS[k].catKo : REGIONS[k].cat; };
const LABEL2KEY = {};
for(const k of Object.keys(REGIONS)){ LABEL2KEY[REGIONS[k].label] = k; LABEL2KEY[REGIONS[k].en] = k; LABEL2KEY[REGIONS[k].ko] = k; }
/* normalise an override body: old shape stored a region KEY in .region */
function normOv(o){
  if(!o) return o;
  const n = Object.assign({}, o);
  if(n.region!==undefined && REGIONS[n.region]) n.region = REGIONS[n.region].label;
  return n;
}
let dbOverrides = {};               // id -> {region?,cat?,name?,desc?, region_en?,cat_en?,name_en?,desc_en?}
let localOv = {};
try{
  const raw = JSON.parse(localStorage.getItem(OV_KEY)||"{}")||{};
  for(const k in raw) localOv[k] = typeof raw[k]==="string" ? {desc:raw[k]} : normOv(raw[k]);
}catch(e){}
let db = null, dbState = "local", readOnly = true;   // static snapshot
let editing = null;                 // {id, field, draft}
const ovOf = r => (dbState==="shared" ? dbOverrides[r.id] : localOv[r.id]) || {};
function base(r){
  if(dl()!=="zh"){
    const e = LANG_DATA[dl()][r.id] || [r.name, r.desc];
    return {region:regLabel(r.region), cat:regCat(r.region), name:e[0], desc:e[1]};
  }
  return {region:regLabel(r.region), cat:r.cat, name:r.name, desc:r.desc};
}
const orig = (r, f) => base(r)[f];
function eff(r){
  const o = ovOf(r), x = sfx(), b = base(r);
  const region = o["region"+x] ?? b.region;                          // displayed text
  const key = LABEL2KEY[region] || r.region;                         // screen position for icon, colour, order
  return {
    key, region,
    cat: o["cat"+x] ?? (key!==r.region ? regCat(key) : b.cat),
    name: o["name"+x] ?? b.name,
    desc: o["desc"+x] ?? b.desc
  };
}
const descOf = r => eff(r).desc;
const isEdited = r => { const e = eff(r); return FIELDS.some(f=>e[f]!==orig(r,f)); };
function setStatus(key, warn){
  const el = document.getElementById("syncStatus");
  el.textContent = key ? t(key) : ""; el.classList.toggle("warn", !!warn);
  el.dataset.key = key || ""; el.dataset.warn = warn ? "1" : "";
}
const byPos = (a,b)=>REGION_ORDER.indexOf(eff(a).key)-REGION_ORDER.indexOf(eff(b).key)||a.id-b.id;
/* region & category filter options follow the current data */
function refreshDynOptions(){
  for(const key of ["region","cat"]){
    const vals = [...new Set(DATA.slice().sort(byPos).map(r=>eff(r)[key]))];
    if(OPTIONS[key].map(o=>o.v).join("\u0001") === vals.join("\u0001")) continue;
    OPTIONS[key] = vals.map(v=>({v,t:v}));
    state[key] = state[key].filter(v=>vals.includes(v));
    const el = document.querySelector('.ms[data-key="'+key+'"]');
    if(el && el.querySelector(".ms-pop")){ buildMS(el); syncMS(); }
  }
}

/* ---------- render ---------- */
const tbody = document.getElementById("rows");
const edBtn = (r, field) => readOnly ? "" :
  '<button type="button" class="ed-btn" data-act="edit" data-rid="'+r.id+'" data-field="'+field+'" title="'+esc(t("ed_edit_"+field))+'" aria-label="'+esc(t("ed_edit_"+field)+"："+eff(r).name)+'">✎</button>';
function editorCell(r, field){
  const e = eff(r), changed = e[field] !== orig(r,field), d = editing.draft;
  const ctrl = field==="desc" ? '<textarea data-edit-ta>'+esc(d)+'</textarea>'
                              : '<input type="text" data-edit-ta autocomplete="off" value="'+esc(d)+'">';
  return '<div class="editor ed-'+field+'">'+ctrl+
    '<div class="ed-bar">'+(field==="desc"?'<span class="hint">'+esc(t("ed_hint"))+'</span>':'')+
    (changed?'<button type="button" data-act="restore">'+esc(t("ed_restore"))+'</button>':'')+
    '<button type="button" data-act="cancel">'+esc(t("ed_cancel"))+'</button>'+
    '<button type="button" class="primary" data-act="save">'+esc(t("ed_save"))+'</button></div></div>';
}
const isEd = (r, f) => editing && editing.id===r.id && editing.field===f;
function render(){
  refreshDynOptions();
  const qn = state.qName.trim().toLowerCase(), qd = state.qDesc.trim().toLowerCase();
  const rows = DATA.filter(r=>{
    const e = eff(r), isChecked = state.checked.includes(r.id);
    if(state.region.length && !state.region.includes(e.region)) return false;
    if(state.cat.length && !state.cat.includes(e.cat)) return false;
    if(state.ver.length && !r.ver.some(v=>state.ver.includes(v))) return false;
    if(state.need.length && !state.need.includes(isChecked?"yes":"no")) return false;
    if(state.prio.length && !state.prio.includes(state.prioMap[r.id]||"none")) return false;
    if(qn && !e.name.toLowerCase().includes(qn)) return false;
    if(qd && !e.desc.toLowerCase().includes(qd)) return false;
    return true;
  }).sort(byPos);
  tbody.innerHTML = rows.map(r=>{
    const c = state.checked.includes(r.id), e = eff(r);
    const mark = f => e[f]!==orig(r,f) ? '<span class="edited-dot" title="'+esc(t("ed_changed"))+'"></span>' : "";
    return '<tr class="'+(c?"checked":"")+'">'+
      '<td class="region edc">'+(isEd(r,"region") ? editorCell(r,"region") :
        '<span class="rg" style="color:var('+COLOR[e.key]+')">'+phone(e.key)+'<span style="color:var(--ink)">'+esc(e.region)+'</span></span>'+mark("region")+edBtn(r,"region"))+'</td>'+
      '<td class="cat edc">'+(isEd(r,"cat") ? editorCell(r,"cat") : esc(e.cat)+mark("cat")+edBtn(r,"cat"))+'</td>'+
      '<td class="ver">'+r.ver.map(v=>'<span class="vtag v-'+v+'">'+esc(t("opt_"+v))+'</span>').join("")+'</td>'+
      '<td class="name edc">'+(isEd(r,"name") ? editorCell(r,"name") : hl(e.name, state.qName.trim())+mark("name")+edBtn(r,"name"))+'</td>'+
      '<td class="desc edc">'+(isEd(r,"desc") ? editorCell(r,"desc") : fmt(e.desc, state.qDesc.trim())+(e.desc!==r.desc?'<span class="edited-dot desc-dot" title="'+esc(t("ed_changed"))+'"></span>':'')+edBtn(r,"desc"))+'</td>'+
      '<td class="need"><input type="checkbox" data-id="'+r.id+'" aria-label="'+esc(t("aria_need")+e.name)+'"'+(c?" checked":"")+(TEAM_LOCK?" disabled":"")+'></td>'+
      (()=>{const pv=state.prioMap[r.id]||"none";
        return '<td class="prio"><select data-prio="'+r.id+'"'+(TEAM_LOCK?' disabled':'')+' class="p-'+pv+'" aria-label="'+esc(t("aria_prio")+e.name)+'">'+
          PRIO_OPTS.map(v=>'<option value="'+v+'"'+(v===pv?" selected":"")+'>'+esc(t("p_"+v))+'</option>').join("")+'</select></td>';})()+
      '</tr>';
  }).join("");
  document.getElementById("empty").hidden = rows.length>0;
  document.getElementById("nShown").textContent = rows.length;
  document.getElementById("nNeed").textContent = state.checked.length;
  document.getElementById("nAll").textContent = DATA.length;
  document.getElementById("nEdited").textContent = DATA.filter(isEdited).length;
  const ta = tbody.querySelector("[data-edit-ta]");
  if(ta && !ta.dataset.focused){ ta.dataset.focused = "1"; ta.focus(); if(ta.setSelectionRange && ta.tagName!=="SELECT") ta.setSelectionRange(ta.value.length, ta.value.length); }
}

/* ---------- editing ---------- */
tbody.addEventListener("click", e=>{
  let b = e.target.closest("[data-act]");
  if(!b && !readOnly && !e.target.closest(".editor") && !window.getSelection().toString()){
    const td = e.target.closest("td.edc"); if(td) b = td.querySelector('.ed-btn');
  }
  if(!b) return;
  const act = b.dataset.act;
  if(act==="edit"){
    const r = DATA.find(x=>x.id===+b.dataset.rid); if(!r) return;
    const f = b.dataset.field;
    editing = {id:r.id, field:f, draft:eff(r)[f]}; render(); return;
  }
  if(!editing) return;
  if(act==="cancel"){ editing = null; render(); }
  else if(act==="save"){ commitEdit(editing.draft); }
  else if(act==="restore"){
    const r = DATA.find(x=>x.id===editing.id);
    if(editing.field!=="desc" || confirm(t("ed_restore_confirm"))) commitEdit(orig(r, editing.field));
  }
});
tbody.addEventListener("input", e=>{ if(e.target.matches("[data-edit-ta]") && editing) editing.draft = e.target.value; });
tbody.addEventListener("change", e=>{ if(e.target.matches("[data-edit-ta]") && editing){ editing.draft = e.target.value; e.stopImmediatePropagation(); } });
tbody.addEventListener("keydown", e=>{
  if(!e.target.matches("[data-edit-ta]") || !editing) return;
  if(e.key==="Escape"){ e.stopPropagation(); editing = null; render(); }
  else if(e.key==="Enter" && (e.ctrlKey || e.metaKey || editing.field!=="desc")){ e.preventDefault(); commitEdit(editing.draft); }
});

function buildDoc(o){
  const doc = {};
  for(const k in DBF) if(o[k]!==undefined) doc[DBF[k]] = o[k];
  return doc;
}
async function commitEdit(value){
  const id = editing.id, field = editing.field, r = DATA.find(x=>x.id===id);
  let clean = field==="desc" ? String(value).replace(/\s+$/,"") : String(value).trim();
  if(field!=="desc" && clean===""){ clean = orig(r, field); }
  if(dbState==="pending") await dbReady;
  const cur = Object.assign({}, dbState==="shared" ? (dbOverrides[id]||{}) : (localOv[id]||{}));
  const fk = field + sfx();
  if(clean === orig(r, field)) delete cur[fk]; else cur[fk] = clean;
  const empty = Object.keys(cur).length===0;
  if(dbState==="shared"){
    setStatus("st_saving");
    const ref = db.doc("descs/"+id);
    const attempt = () => empty ? ref.delete() : ref.set(Object.assign(buildDoc(cur), {updatedAt:new Date().toISOString()}));   // set() replaces, so a legacy .region key is dropped
    try{
      try{ await attempt(); }
      catch(err){ if(err && err.code==="unavailable"){ await new Promise(res=>setTimeout(res, 600+Math.random()*900)); await attempt(); } else throw err; }
      if(empty) delete dbOverrides[id]; else dbOverrides[id] = cur;
      editing = null; setStatus("st_saved"); render();
      setTimeout(()=>{ if(document.getElementById("syncStatus").dataset.key==="st_saved") setStatus("st_shared"); }, 2500);
    }catch(err){
      const code = err && err.code;
      if(code==="invalid_argument"){ readOnly = true; editing = null; setStatus("st_readonly", true); render(); }
      else if(code==="quota_exceeded"){ setStatus("st_quota", true); }
      else if(code==="revoked"||code==="not_granted"||code==="capability_disabled"){ dbState = "local"; saveLocal(id, cur, empty); }
      else setStatus("st_error", true);
    }
  }else{
    saveLocal(id, cur, empty);
  }
}
function saveLocal(id, cur, empty){
  if(empty) delete localOv[id]; else localOv[id] = cur;
  try{ localStorage.setItem(OV_KEY, JSON.stringify(localOv)); }catch(e){}
  editing = null; setStatus("st_local", true); render();
}
tbody.addEventListener("change", e=>{
  if(e.target.dataset.prio){
    const pid = e.target.dataset.prio, v = e.target.value;
    if(v==="none") delete state.prioMap[pid]; else state.prioMap[pid] = v;
    save(); render(); return;
  }
  const id = +e.target.dataset.id; if(!id) return;
  state.checked = e.target.checked ? [...new Set([...state.checked,id])] : state.checked.filter(x=>x!==id);
  save(); render();
});

/* ---------- title: ink spans exactly from the toggles' top to the stats' bottom ---------- */
const TITLE_SCALE = 0.8;
function fitTitle(){ try{ fitTitleInner(); }catch(e){} }
function fitTitleInner(){
  const h1 = document.querySelector("h1"), right = document.querySelector(".hd-right"), wrap = h1.parentElement;
  h1.style.fontSize = h1.style.lineHeight = h1.style.transform = ""; wrap.style.height = "";
  const hb = document.querySelector("header").getBoundingClientRect(), rb = right.getBoundingClientRect();
  if(window.innerWidth <= 640 || rb.top > hb.top + 4) return;           // stacked layout: keep default size
  const cs = getComputedStyle(h1), ctx = document.createElement("canvas").getContext("2d");
  ctx.font = cs.fontWeight+" 100px "+cs.fontFamily;
  const m = ctx.measureText(h1.textContent);
  const inkA = m.actualBoundingBoxAscent/100, inkD = m.actualBoundingBoxDescent/100;
  const fA = (m.fontBoundingBoxAscent ?? m.actualBoundingBoxAscent)/100, fD = (m.fontBoundingBoxDescent ?? m.actualBoundingBoxDescent)/100;
  const H = rb.height;
  let size = H/(inkA+inkD);
  const ls = parseFloat(cs.letterSpacing)||0, chars = h1.textContent.length;
  const avail = rb.left - hb.left - 24;
  const textW = m.width/100*size + (ls/parseFloat(cs.fontSize))*size*chars;
  if(textW > avail) size *= avail/textW;
  size *= TITLE_SCALE;
  h1.style.fontSize = size+"px"; h1.style.lineHeight = "1";
  const baseline = (size - (fA+fD)*size)/2 + fA*size;                  // baseline within a line-height:1 box
  const inkTop = baseline - inkA*size;
  const inkH = (inkA+inkD)*size;
  h1.style.transform = "translateY("+(-inkTop + (H-inkH)/2)+"px)";   // centred in the header height
  wrap.style.height = H+"px";
}
window.addEventListener("resize", fitTitle);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

const TEAM_LOCK = !EDIT_MODE;
const TEAM_STR = {
  zh:{msg:"编辑模式：修改勾选和优先级后，下载 state.json 并上传到 GitHub 仓库覆盖原文件，团队成员刷新后即可看到。", dl:"下载 state.json"},
  en:{msg:"Edit mode: after changing checkboxes and priorities, download state.json and upload it to the GitHub repo to replace the old file; teammates see it after a refresh.", dl:"Download state.json"},
  ko:{msg:"편집 모드: 체크와 우선순위를 변경한 뒤 state.json을 다운로드하여 GitHub 저장소의 기존 파일을 덮어쓰면, 팀원이 새로고침 후 볼 수 있습니다.", dl:"state.json 다운로드"}
};
function applyTeamBar(){
  const bar = document.getElementById("teamBar"); if(!bar) return;
  bar.hidden = !EDIT_MODE;
  const L = TEAM_STR[state.lang] || TEAM_STR.zh;
  document.getElementById("teamMsg").textContent = L.msg;
  document.getElementById("dlState").textContent = L.dl;
}
async function loadTeamState(){
  try{
    const res = await fetch("state.json", {cache:"no-store"});
    if(!res.ok) return;
    const team = await res.json();
    if(EDIT_MODE && state._editDraft) return;             // keep an unfinished local draft
    state.checked = Array.isArray(team.checked) ? team.checked.map(Number) : [];
    state.prioMap = (team.prio && typeof team.prio==="object") ? team.prio : {};
    render();
  }catch(e){}
}
document.getElementById("dlState").addEventListener("click", ()=>{
  const data = {checked: state.checked.slice().sort((a,b)=>a-b), prio: state.prioMap, savedAt: new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "state.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  state._editDraft = false; save();
});
tbody.addEventListener("change", e=>{ if(EDIT_MODE && (e.target.dataset.id || e.target.dataset.prio)){ state._editDraft = true; save(); } });

/* ---------- init ---------- */
load();
if(!EDIT_MODE){ state.checked = []; state.prioMap = {}; }
applyTheme(); applyLang();
document.querySelectorAll(".ms").forEach(buildMS);
qName.value = state.qName; qDesc.value = state.qDesc;
syncMS(); render(); fitTitle(); applyTeamBar(); loadTeamState();

/* ---------- shared storage bootstrap ---------- */
const dbReady = (async ()=>{
  const use = n => (window.claude && typeof window.claude.use==="function") ? window.claude.use(n) : Promise.resolve(null);
  db = null;
  if(!db){ dbState = "local"; render(); return; }
  try{
    const user = await use("user");
    const can = user ? await user.can("data.write") : null;
    if(can===false){ readOnly = true; }
  }catch(e){}
  await new Promise(resolve=>{
    let first = true;
    setTimeout(()=>{ if(first){ first = false; dbState = "local"; setStatus("st_local", true); resolve(); if(!editing) render(); } }, 12000);
    db.collection("descs").onSnapshot(snap=>{
      const next = {};
      snap.docs.forEach(d=>{
        const v = d.data(); if(!v) return;
        const o = {};
        for(const k in DBF){ const x = v[DBF[k]]; if(typeof x==="string") o[k] = x; }
        if(o.region===undefined && typeof v.region==="string" && REGIONS[v.region]) o.region = REGIONS[v.region].label;   // legacy key
        if(Object.keys(o).length) next[+d.id] = o;
      });
      dbOverrides = next;
      if(first){ first = false; dbState = "shared"; setStatus(readOnly?"st_readonly":"st_shared", readOnly); resolve(); }
      if(!editing) render();
    }, err=>{
      if(first){ first = false; dbState = "local"; setStatus("st_local", true); resolve(); }
      else if(err && err.code==="revoked"){ readOnly = true; setStatus("st_readonly", true); }
      if(!editing) render();
    });
  });
})();
</script>
</body>
